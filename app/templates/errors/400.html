{% extends "base.html" %}
{% block title %}We could not process that{% endblock %}
{% block content %}
<div class="empty">
  <span class="pill pill-warning">400</span>
  <h3>That request did not make sense</h3>
  <p class="muted">{{ message or "Something in the request was malformed. Your basket is safe." }}</p>
  <div class="btn-row" style="justify-content:center">
    <a class="btn btn-primary" href="{{ url_for('storefront.catalog') }}">Back to the catalogue</a>
    <a class="btn btn-ghost" href="{{ url_for('checkout.basket') }}">Open my basket</a>
  </div>
</div>
{% endblock %}
